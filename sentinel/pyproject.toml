[project]
name = "sentinel"
version = "0.1.0"
description = "Système personnel d'analyse de marché et d'alertes Telegram (aide à la décision, aucune exécution d'ordre)."
requires-python = ">=3.12"
dependencies = [
    "websockets>=13.0",
    "httpx[http2]>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "structlog>=24.1",
    "numpy>=1.26",
    "polars>=1.0",
    "pyarrow>=16.0",
    "matplotlib>=3.11.2",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
    "pandas>=2.2",
    "aiohttp>=3.9",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: nécessite le réseau (Binance) — exclu par défaut, lancer avec -m live"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC"]
ignore = ["RUF001", "RUF002", "RUF003"]  # caractères accentués dans les commentaires FR

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ASYNC110", "E731"]  # attentes bornées et petites fabriques lambda dans les tests
"scripts/*" = ["E501"]  # chaînes de mise en forme du rapport

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]
